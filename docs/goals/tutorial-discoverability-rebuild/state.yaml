version: 2

goal:
  title: "Tutorial Discoverability Rebuild"
  slug: "tutorial-discoverability-rebuild"
  kind: existing_plan
  tranche: "Continuous execution through research, implementation, and rendered verification of the full tutorial and discoverability system."
  status: done
  intake:
    original_request: "Remake /tutorial with anime.js, clearer guidance, science and topical SEO pages, stronger schema/crawlability, and the supplied logo outside the header and in social metadata."
    interpreted_outcome: "A clear, credible, motion-rich public learning hub that teaches Cognistration and earns relevant search/AI visibility without keyword stacking or scientific overclaiming."
    input_shape: existing_plan
    audience: "Meditation, self-exploration, dreamwork, astral-projection, metaphysics, and remote-viewing learners."
    authority: requested
    proof_type: demo
    completion_proof: "Build, tests, source checks, and rendered route audits prove all requested UX, content, SEO, branding, crawlability, accessibility, and sourcing requirements."
    likely_misfire: "A stylish keyword-stuffed page that obscures platform guidance, overclaims science, or breaks protected product/header behavior."
    blind_spots_considered:
      - "Scientific and historical claim quality"
      - "Distinct search intent versus doorway-page risk"
      - "Motion accessibility, mobile performance, and cleanup"
      - "Supported schema and crawl/index behavior"
      - "Logo and social-preview format requirements"
      - "Protected Workshop, header, and paid-product behavior"
    existing_plan_facts:
      - "Use anime.js and advanced motion on /tutorial."
      - "Make platform usage substantially clearer."
      - "Explain the science behind the experience responsibly."
      - "Target astral projection, metaphysics, deep dreaming, remote viewing, meditation, and self-exploration with semantic phrases."
      - "Use breadcrumb-linked granular pages if they improve intent clarity and avoid keyword stacking."
      - "Link remote-viewing content to primary CIA studies/documents."
      - "Improve schema, snippets, metadata, URLs, robots, and AI-search legibility."
      - "Use the supplied logo everywhere except the existing header and in shared-link metadata."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/tutorial-discoverability-rebuild/"
    command: "npx goalbuddy board docs/goals/tutorial-discoverability-rebuild"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

