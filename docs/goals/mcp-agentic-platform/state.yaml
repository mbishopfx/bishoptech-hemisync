# GoalBuddy v2 state for the Cognistration agentic platform goal.
version: 2

goal:
  title: "Expand Cognistration's WebMCP agentic tone platform"
  slug: "mcp-agentic-platform"
  kind: existing_plan
  tranche: "Research current capability and synthesis truth, implement broad governed tone composition plus one evidence-selected standout agentic feature, then verify the canonical release."
  status: done
  intake:
    original_request: "Research the current agentic Cognistration platform, route nearly every meaningful frequency option through MCP, and implement a standout new agentic feature for the WebMCP challenge submission."
    interpreted_outcome: "Let agents safely compose tones across the real synthesis range and add one distinctive, challenge-worthy capability proven on the live product."
    input_shape: existing_plan
    audience: "Cognistration visitors, browser agents, external MCP clients, authenticated members"
    authority: requested
    proof_type: artifact
    completion_proof: "Final audit proves broad bounded frequency composition and the selected standout feature through strict shared MCP/WebMCP contracts, regression tests, rendered behavior, and canonical production operations."
    likely_misfire: "A flashy shallow tool, unsafe raw controls, duplicated logic, or a preset-only implementation described as arbitrary tone composition."
    blind_spots_considered:
      - "WebMCP and current MCP protocol surfaces are evolving."
      - "The app is nested in a dirty parent checkout."
      - "Supabase migration privilege and live member proof are not yet established."
      - "AI/provider failure must not stop safe deterministic tone selection."
      - "Account and payment actions must remain user-controlled."
      - "Numeric ranges and cross-field rules must match the actual synthesis and render engine."
      - "Frequency and state language must remain non-medical and non-diagnostic."
    existing_plan_facts:
      - "Use /Users/matthewbishop/BishopTech.dev/bishoptech-agenticstructure."
      - "Inspect the existing app and deployment before architecture changes."
      - "Vercel CLI and Supabase CLI are logged in."
      - "Preserve existing homepage/header work and unrelated dirty changes."
      - "Preserve the completed public/member foundation and public challenge mirror."
      - "Expose nearly every meaningful tone-frequency option through governed shared contracts."
      - "Select the standout feature from live, repository, and current WebMCP evidence before implementing it."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

