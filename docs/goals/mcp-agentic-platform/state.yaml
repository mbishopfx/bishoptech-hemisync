  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/mcp-agentic-platform/"
    command: "npx goalbuddy board docs/goals/mcp-agentic-platform"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
